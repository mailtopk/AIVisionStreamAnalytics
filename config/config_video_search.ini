[video_search]
# Default CLIP model
default_model=openai/clip-vit-base-patch32

# Supported models (can use any from Hugging Face)
# Available models:
# - openai/clip-vit-base-patch32 (512-dim, default)
# - openai/clip-vit-large-patch14 (768-dim, more accurate)
# - openai/clip-vit-large-patch14-336 (336x336 input, slower)
supported_models=openai/clip-vit-base-patch32,openai/clip-vit-large-patch14

[frame_extraction]
# Default fps for extraction
default_fps=1

# Maximum frames to process in a single run
max_frames_per_video=1000

# Output directory for extracted frames
output_directory=./video_frames

# Frame format
frame_format=png

# Video codecs to support
supported_codecs=mp4,avi,mov,mkv,flv,wmv

[search]
# Default number of results
default_top_k=5

# Similarity threshold for filtering results (0.0-1.0)
similarity_threshold=0.0

# Search batch size (process multiple queries in parallel)
batch_size=10

[summarization]
# Default number of keyframes
default_keyframes=5

# Minimum number of keyframes
min_keyframes=1

# Maximum number of keyframes
max_keyframes=100

# Scene change detection threshold (0.0-1.0)
# Lower = more sensitive to scene changes
scene_change_threshold=0.5

[performance]
# Device: 'cuda' for GPU, 'cpu' for CPU, 'auto' for auto-detect
device=auto

# Batch size for CLIP encoding
encoding_batch_size=8

# Enable frame caching
cache_frames=true

# Cache directory
cache_directory=./.video_cache

# Maximum cache size (MB)
max_cache_size=5000

[gstreamer]
# Enable GStreamer backend (if available)
enable_gstreamer=true

# GStreamer pipeline timeout (seconds)
pipeline_timeout=30

# Fallback to OpenCV if GStreamer fails
fallback_to_opencv=true

[output]
# Save embeddings format
embeddings_format=npy

# Save metadata format
metadata_format=json

# Save keyframe info
save_keyframe_metadata=true

# Include frame paths in output
include_frame_paths=true

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR
log_level=INFO

# Log file path (empty = console only)
log_file=

# Verbose output
verbose=false

[advanced]
# Normalize embeddings (recommended)
normalize_embeddings=true

# Embedding dimension (auto from model, can override for compatibility)
embedding_dim=auto

# Frame preprocessing
apply_preprocessing=true

# RGB conversion for compatibility
force_rgb_conversion=true
